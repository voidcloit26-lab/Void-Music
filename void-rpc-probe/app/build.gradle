plugins { id 'com.android.application' }
android {
    namespace 'online.voidbot.rpcprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'online.voidbot.rpcprobe'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-local-probe'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    ndkVersion '27.2.12479018'
    buildFeatures { prefab true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { debug { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation files('libs/discord_partner_sdk.aar') }
tasks.named('preBuild').configure {
    doFirst { if (!file('libs/discord_partner_sdk.aar').isFile()) throw new GradleException('Place your authorized SDK release AAR in app/libs before building.') }
}
