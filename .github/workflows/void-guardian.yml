name: VOID Guardian Core Tests
on:
  push:
    branches: [feat/void-guardian-access-20261125]
    paths: ['guardian/**', '.github/workflows/void-guardian.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s guardian -v
