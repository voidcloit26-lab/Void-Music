name: VOID Music protected Android staging build
on:
  push:
    branches: [test]
    paths: ['.github/workflows/void-guardian-android-staging.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: void-guardian-android-staging
  cancel-in-progress: true
jobs:
  protected-fast:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VOID_GUARDIAN_ENFORCED: 'true'
      VOID_GUARDIAN_ORIGIN: https://void-guardian-staging.onrender.com
      VOID_GUARDIAN_PUBLIC_KEY: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEBuqQpt9NvZOua1--_997L_zDV1uvgEEhXXBSDc_cp2dCZ90AUycBvuTrIhDsEvue4PvkrQj5dwLFCmPpOkzVew
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build protected test APK (no native Discord SDK)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -e "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VOID Guardian Staging,O=Android,C=IN"
          fi
          chmod +x gradlew
          ./gradlew --console=plain --no-configuration-cache :app:assembleUniversalGmsFast --warning-mode summary
      - name: Verify protected build configuration and APK signature
        run: |
          set -euo pipefail
          cfg=$(find app/build/generated -name BuildConfig.java | grep -i universalGmsFast | head -n1)
          test -n "$cfg"
          grep -Eq 'VOID_GUARDIAN_ENFORCED = true;' "$cfg"
          grep -F "$VOID_GUARDIAN_PUBLIC_KEY" "$cfg"
          grep -F "$VOID_GUARDIAN_ORIGIN" "$cfg"
          apk=$(find app/build/outputs/apk/universalGms/fast -maxdepth 1 -name '*.apk' -print -quit)
          test -s "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$signer" verify --verbose "$apk"
          sha256sum "$apk" > guardian-staging-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: void-guardian-protected-staging-apk-not-release
          path: |
            app/build/outputs/apk/universalGms/fast/*.apk
            guardian-staging-apk.sha256
          retention-days: 3
          if-no-files-found: error
