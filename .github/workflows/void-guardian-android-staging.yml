name: VOID Music protected Android staging build
on:
  push:
    branches: [test]
    paths:
      - '.github/workflows/void-guardian-android-staging.yml'
      - 'app/src/main/**'
      - 'scripts/void_brand_audit.py'
      - 'gradle/**'
      - 'app/build.gradle.kts'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: void-guardian-android-staging
  cancel-in-progress: false
jobs:
  protected-fast:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VOID_GUARDIAN_ENFORCED: 'true'
      VOID_GUARDIAN_ORIGIN: https://void-guardian-staging.onrender.com
      VOID_GUARDIAN_PUBLIC_KEY: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEBuqQpt9NvZOua1--_997L_zDV1uvgEEhXXBSDc_cp2dCZ90AUycBvuTrIhDsEvue4PvkrQj5dwLFCmPpOkzVew
    steps:
      - uses: actions/checkout@v4
      - name: Check branding and legal navigation
        run: python3 scripts/void_brand_audit.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install API 37.0 Android build dependencies
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Build protected test APK (no native Discord SDK)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -e "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VOID Guardian Staging,O=Android,C=IN"
          fi
          chmod +x gradlew
          ./gradlew --console=plain --no-configuration-cache :app:assembleUniversalGmsFast --warning-mode summary
      - name: Verify protected build configuration and APK signature
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          candidates = [p for p in Path("app/build/generated").rglob("BuildConfig.java") if "VOID_GUARDIAN_ENFORCED" in p.read_text()]
          assert len(candidates) == 1, f"Expected one Guardian BuildConfig, found {candidates}"
          cfg = candidates[0].read_text()
          assert re.search(r"\bVOID_GUARDIAN_ENFORCED\s*=\s*true\s*;", cfg), "Guardian not enforced"
          for field in ("VOID_GUARDIAN_ORIGIN", "VOID_GUARDIAN_PUBLIC_KEY"):
              assert re.search(r"\b" + field + r'\s*=\s*"' + re.escape(os.environ[field]) + r'"\s*;', cfg), f"Incorrect {field}"
          print("Verified protected BuildConfig:", candidates[0])
          PY
          apk=$(find app/build/outputs/apk/universalGms/fast -maxdepth 1 -name '*.apk' -print -quit)
          test -s "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$signer" verify --verbose "$apk"
          "$(dirname "$signer")/aapt" dump badging "$apk" > guardian-staging-badging.txt
          grep -F "package: name='online.voidbot.music.fast'" guardian-staging-badging.txt
          if grep -q "application-debuggable" guardian-staging-badging.txt; then exit 1; fi
          sha256sum "$apk" > guardian-staging-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: void-guardian-protected-staging-apk-not-release
          path: |
            app/build/outputs/apk/universalGms/fast/*.apk
            guardian-staging-apk.sha256
            guardian-staging-badging.txt
          retention-days: 3
          if-no-files-found: error
