name: VOID RPC private Android build
on:
  push:
    branches: [test]
    paths:
      - 'void-rpc-probe/**'
      - '.github/workflows/void-rpc-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: void-rpc-private-build
  cancel-in-progress: true
jobs:
  build-probe:
    if: github.ref == 'refs/heads/test' && vars.VOID_RPC_SDK_TEST_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Load authorized SDK from private developer storage
        env:
          SDK_URL: ${{ secrets.VOID_RPC_SDK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SDK_URL" || { echo 'Private SDK URL not configured'; exit 1; }
          mkdir -p void-rpc-probe/app/libs
          curl --fail --silent --show-error --proto '=https' --max-time 120 --output void-rpc-probe/app/libs/discord_partner_sdk.aar "$SDK_URL"
          echo 'ea4c080cc7c5ddeccab58f3bdf5682a3e18a7a84a815bb0f33609bfcafba3f99  void-rpc-probe/app/libs/discord_partner_sdk.aar' | sha256sum -c -
      - name: Compile separate native RPC diagnostic
        working-directory: void-rpc-probe
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Verify Android signature and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=void-rpc-probe/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > rpc-apk-permissions.txt
          if grep -E 'RECORD_AUDIO|BLUETOOTH_CONNECT|FOREGROUND_SERVICE_MICROPHONE' rpc-apk-permissions.txt; then
            echo 'Unexpected permissions in merged APK'
            exit 1
          fi
          unzip -l "$APK" | grep 'lib/arm64-v8a/libvoid_rpc_probe.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libdiscord_partner_sdk.so'
      - name: Upload private diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: void-rpc-android-private-test
          path: |
            void-rpc-probe/app/build/outputs/apk/debug/app-debug.apk
            rpc-apk-permissions.txt
          if-no-files-found: error
          retention-days: 1
      - name: Remove SDK from runner workspace
        if: always()
        run: rm -f void-rpc-probe/app/libs/discord_partner_sdk.aar
